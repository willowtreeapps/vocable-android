name: Pre-Release Upload

on:
  workflow_call:

jobs:
  device-tests:
    uses: ./.github/workflows/device-tests.yml
    secrets: inherit

  pre-release-upload:
    needs: device-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set Up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Decode Keystore
        env:
          ENCODED_RELEASE_KEYSTORE: ${{ secrets.ENCODED_RELEASE_KEYSTORE }}
        run: echo $ENCODED_RELEASE_KEYSTORE | base64 -d > keystore

      - name: Decode google-services.json
        env:
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
        run: echo $GOOGLE_SERVICES_JSON_B64 | base64 -d > app/google-services.json

      - name: Authenticate to Google Play
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.PLAY_STORE_CREDENTIALS }}
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher

      - name: Compute next versionCode
        id: version_code
        run: |
          value=$(./scripts/get-next-version-code.sh com.willowtree.vocable)
          echo "value=$value" >> "$GITHUB_OUTPUT"

      - name: Build & Assemble Release APK/Bundle
        env:
          VERSION_CODE: ${{ steps.version_code.outputs.value }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease bundleRelease

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Decode Firebase Service Account JSON
        run: echo ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BASE_64 }} | base64 -d > service_account.json

      - name: Deploy to Firebase
        env:
          GOOGLE_APPLICATION_CREDENTIALS: service_account.json
        run: firebase appdistribution:distribute app/build/outputs/apk/release/app-release.apk --app ${{ secrets.FIREBASE_APP_ID }} --groups "internal"

      - name: Upload to Play Store
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_CREDENTIALS }}
          packageName: com.willowtree.vocable
          releaseFiles: app/build/outputs/bundle/release/app-release.aab
          track: alpha