name: Pre-Release Upload

on:
  workflow_call:
  workflow_dispatch:
    inputs:
      skip_device_tests:
        description: >-
          Skip device-tests. A standalone dispatch has no build.yml "build"
          job in the same run to produce the debug/androidTest APKs
          device-tests.yml downloads, so it always fails "not found" outside
          of the normal build.yml -> pre-release-upload.yml call chain.
        type: boolean
        default: false

jobs:
  device-tests:
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.skip_device_tests }}
    uses: ./.github/workflows/device-tests.yml
    secrets: inherit

  pre-release-upload:
    needs: device-tests
    if: ${{ always() && (needs.device-tests.result == 'success' || needs.device-tests.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set Up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Decode Keystore
        env:
          ENCODED_RELEASE_KEYSTORE: ${{ secrets.ENCODED_RELEASE_KEYSTORE }}
        run: echo $ENCODED_RELEASE_KEYSTORE | base64 -d > keystore

      - name: Decode google-services.json
        env:
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
        run: echo $GOOGLE_SERVICES_JSON_B64 | base64 -d > app/google-services.json

      - name: Install google-auth
        run: pip install --quiet google-auth requests

      - name: Compute next versionCode
        id: version_code
        env:
          SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_STORE_CREDENTIALS }}
        run: |
          value=$(./scripts/get-next-version-code.sh com.willowtree.vocable)
          echo "value=$value" >> "$GITHUB_OUTPUT"

      - name: Build & Assemble Release APK/Bundle
        env:
          VERSION_CODE: ${{ steps.version_code.outputs.value }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease bundleRelease

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Decode Firebase Service Account JSON
        run: echo ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BASE_64 }} | base64 -d > service_account.json

      - name: Deploy to Firebase
        env:
          GOOGLE_APPLICATION_CREDENTIALS: service_account.json
        run: firebase appdistribution:distribute app/build/outputs/apk/release/app-release.apk --app ${{ secrets.FIREBASE_APP_ID }} --groups "internal"

      - name: Upload to Play Store
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_CREDENTIALS }}
          packageName: com.willowtree.vocable
          releaseFiles: app/build/outputs/bundle/release/app-release.aab
          track: alpha